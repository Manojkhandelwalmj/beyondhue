name: beyondhue
description: A colour analysis and outfit matching app for colour blind users

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  image_picker: ^1.0.7
  palette_generator: ^0.3.3+3
  provider: ^6.1.2

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  path_provider: ^2.1.2
  uuid: ^4.3.3

  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/